# Gitleaks configuration for Yet Another File Manager.
#
# The two RSA private keys in backend/tests/oidc_flow.rs are throwaway test
# keys generated once for the mock identity provider (the file documents
# them). They are not secrets, so scanning them would only produce noise.

[extend]
useDefault = true

[allowlist]
paths = [
  '''backend/tests/oidc_flow.rs'''
]
# Test fixtures that deliberately look like secrets but are not. The signing
# key below is a self-documenting placeholder used by the config-parser unit
# tests (see backend/src/lib.rs and config/yafm.config.example.yaml).
regexes = [
  '''replace-signing-key-0123456789abcdef''',
  '''replace-me'''
]
