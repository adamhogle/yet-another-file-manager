# Absolute path, or relative to the backend binary's working directory.
# npm run dev resolves this as backend/../dev-data/share = dev-data/share.
sharedRoot: ../dev-data/share
showHidden: false
# listing filter only — not an access control; hidden files are still downloadable by name
listenAddress: 0.0.0.0
listenPort: 8080

# Access control (ADR-0005). Required: the backend refuses to start without
# it. A user's visible root is the union of the global allow list and the
# allow entries of their authentik groups (from the ID token's groups claim,
# filtered to the names below), minus every matching deny. Order does not
# matter; denied means nothing underneath it is accessible. Allows are plain
# paths ("/" is the root itself); deny patterns use gitignore glob semantics
# (`*` within a segment, `?` one character, `**` across segments, a bare name
# matches at any depth) and match files and directories. Verify the mapping
# without serving traffic: backend --check-access --groups <comma-separated
# groups> [config-path]
access:
  # Global baseline: every user sees this, regardless of groups.
  allow: ['/common']
  # Global deny: every user, everywhere.
  deny: ['.env', '.git']
  grants:
    # Each grant maps an authentik group name to allow entries with optional
    # paired allow-specific denies, scoped to that allow's path only.
    yafm-tv:
      allow:
        - path: '/tv-shows'
          deny: ['*.nfo']
    yafm-devs:
      allow:
        - path: '/dev'
          deny: ['dev/tmp/**']
        - path: '/projects'

# OIDC authentication (authentik). Required: the backend refuses to start
# without it. Get the issuer from the provider's .well-known/openid-configuration
# (default issuer mode is per-provider: .../application/o/<application slug>/).
oidc:
  issuer: https://authentik.example.com/application/o/yafm/
  clientId: yafm-spa
  clientSecret: replace-me
  redirectUri: https://files.example.com/api/v1/auth/callback
  # Independent cookie-signing key. Optional: when omitted, a random key is
  # generated per process and every restart invalidates outstanding
  # sessions. Generate a stable key with: openssl rand -base64 32
  # (a configured key shorter than 32 bytes is refused at startup).
  # sessionSigningKey: <base64 key>
  # Set false explicitly only with a loopback http redirectUri for local development.
  cookieSecure: true
