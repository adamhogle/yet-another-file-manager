name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for git-height versioning (compute-version.mjs)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve build version
        run: node scripts/compute-version.mjs

      - name: Read pinned toolchain
        id: rust-pin
        run: echo "channel=$(grep -oP 'channel = "\K[^"]+' backend/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-pin.outputs.channel }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Clippy
        run: cd backend && cargo clippy -- -D warnings

      - name: Format check
        run: cd backend && cargo fmt --check

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend assets for contract checks
        run: npm run frontend:build

      - name: Check OpenAPI and generated client drift
        run: npm run contract:check

      - name: Backend and frontend checks
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Dependency advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml

      - name: npm audit
        run: npm audit --audit-level=high && npm audit --audit-level=high --prefix frontend

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-image:
    needs: [quality, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for git-height versioning (compute-version.mjs)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve build version
        id: version
        run: node scripts/compute-version.mjs --github-output >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build devcontainer target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: devcontainer
          push: false
          load: true # export to the local daemon so the assertion step can docker run it
          tags: |
            yet-another-file-manager:devcontainer-ci
            yet-another-file-manager:devcontainer-${{ steps.version.outputs.image_version }}
            yet-another-file-manager:devcontainer-${{ steps.version.outputs.sha_tag }}
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,mode=max,scope=devcontainer

      - name: Assert devcontainer toolchain matches rust-toolchain.toml
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker run --rm yet-another-file-manager:devcontainer-ci rustup toolchain list | grep -F "$(grep -oP 'channel = "\K[^"]+' backend/rust-toolchain.toml)"

      - name: Build runtime image
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: |
            yet-another-file-manager:runtime-ci
            yet-another-file-manager:${{ steps.version.outputs.image_version }}
            yet-another-file-manager:${{ steps.version.outputs.sha_tag }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Publish runtime image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/adamhogle/yet-another-file-manager:${{ steps.version.outputs.image_version }}
            ghcr.io/adamhogle/yet-another-file-manager:${{ steps.version.outputs.release_line }}
            ghcr.io/adamhogle/yet-another-file-manager:${{ steps.version.outputs.sha_tag }}
            ghcr.io/adamhogle/yet-another-file-manager:latest
          labels: |
            org.opencontainers.image.source=https://github.com/adamhogle/yet-another-file-manager
            org.opencontainers.image.version=${{ steps.version.outputs.image_version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
