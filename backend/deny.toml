# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
# Vulnerability advisories always fail. Unmaintained advisories fail for direct
# workspace dependencies (the ones we can act on) and only warn for transitive ones.

[advisories]
unmaintained = "workspace"

[licenses]
# Matches the project's AGPL-3.0-only stance plus the licenses used by the current
# dependency tree. Everything not listed here is denied by default.
confidence-threshold = 0.8
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
# Duplicate versions are reported but do not fail CI; tighten if the tree allows.
multiple-versions = "warn"

[sources]
# All dependencies come from crates.io; reject anything else.
unknown-registry = "deny"
unknown-git = "deny"
