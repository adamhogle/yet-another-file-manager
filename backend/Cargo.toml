[package]
name = "backend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
rust-embed = "8.9.0"
mime_guess = "2.0.5"
once_cell = "1.21.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
urlencoding = "2.1.3"
# URL parsing for the OIDC config validation (issuer/redirectUri shapes). Already
# in the lockfile transitively via openidconnect/oauth2; declared explicitly
# because lib.rs uses it directly.
url = "2.5.8"
# OIDC auth (authentik). Both crates must keep the runtime TLS stack rustls-only:
# the Docker image installs only ca-certificates, so an OpenSSL/curl-backed HTTP
# client would compile but fail to load at runtime. openidconnect's defaults are
# already ["reqwest", "rustls-tls"]; the explicit list pins that intent. cookie's
# `Key` (key-expansion) powers the signed session cookies added with the auth gate.
openidconnect = { version = "4.0", default-features = false, features = ["reqwest", "rustls-tls"] }
cookie = { version = "0.18", default-features = false, features = ["percent-encode", "signed", "private", "key-expansion"] }
# SHA-256 expansion of the OIDC client secret into the 32-byte master key that
# cookie::Key::derive_from requires (HKDF-SHA256 inside the cookie crate). Already
# in the lockfile transitively via openidconnect/rust-embed-utils; declared
# explicitly because auth.rs uses it directly.
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.3"
