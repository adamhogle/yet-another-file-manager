[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "fs"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
rust-embed = "8.9.0"
mime_guess = "2.0.5"
once_cell = "1.21.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.3"
