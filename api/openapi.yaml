openapi: 3.1.0
info:
  title: Yet Another File Manager
  description: A web-based file manager for self-hosted local file sharing.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.txt
  version: 0.1.0
paths:
  /api/v1/directory:
    get:
      tags: []
      operationId: getApiV1Directory
      parameters:
        - name: p
          in: query
          description: Relative path under shared root
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryListing'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
        '404':
          description: Directory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
        '503':
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
  /api/v1/download:
    get:
      tags: []
      operationId: getApiV1Download
      parameters:
        - name: p
          in: query
          description: Relative file path under shared root
          required: false
          schema:
            type: string
      responses:
        '200':
          description: File download stream
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
        '503':
          description: Storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
  /api/v1/health:
    get:
      tags: []
      operationId: getApiV1Health
      responses:
        '200':
          description: API health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    DirectoryEntry:
      type: object
      required:
        - name
        - kind
        - modifiedAt
      properties:
        kind:
          $ref: '#/components/schemas/EntryKind'
        modifiedAt:
          type: string
        name:
          type: string
        sizeBytes:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
    DirectoryListing:
      type: object
      required:
        - currentPath
        - entries
      properties:
        currentPath:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        parentPath:
          type:
            - string
            - 'null'
    EntryKind:
      type: string
      enum:
        - directory
        - file
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        service:
          type: string
        status:
          type: string
    PublicErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
